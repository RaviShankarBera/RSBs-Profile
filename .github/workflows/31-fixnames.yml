name: fix-upload-names
on:
  push:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip numeric upload prefixes
        run: |
          changed=0
          while IFS= read -r f; do
            d=$(dirname "$f"); b=$(basename "$f")
            case "$f" in .github/*) continue;; esac
            if echo "$b" | grep -Eq '^[0-9]+-'; then
              n="${b#*-}"
              if [ "$d" = "." ]; then t="$n"; else t="$d/$n"; fi
              mv -f "$f" "$t"; changed=1
            fi
          done < <(git ls-files)
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Normalize uploaded file names"
            git push
          fi
